<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Envoyer de l'argent à Marlet Djenontin</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f5f7fa; margin: 0; padding: 20px 16px; }
    .card { background: #fff; max-width: 480px; margin: auto; padding: 24px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.3rem; }
    label { font-size: .85rem; color: #555; }
    input, select { width: 100%; padding: 14px; margin: 6px 0 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
    button { width: 100%; padding: 16px; background: #16a34a; color: #fff; border: none; border-radius: 8px; font-size: 1.05rem; cursor: pointer; }
    button:disabled { opacity: .6; }
    .methods { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .methods span { border: 1px solid #eee; padding: 8px 12px; border-radius: 8px; font-size: .85rem; }
    #msg { margin-top: 16px; color: #b91c1c; word-break: break-word; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:10; align-items:center; justify-content:center; padding:20px; }
    .modal.show { display:flex; }
    .modal-box { background:#fff; border-radius:14px; padding:28px 24px; max-width:360px; width:100%; text-align:center; font-size:1.05rem; box-shadow:0 20px 50px rgba(0,0,0,.25); }
    .modal-box button { margin-top:18px; padding:12px; background:#111; }
    @media (max-width: 480px) {
      .card { padding: 20px; border-radius: 12px; }
      h1 { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💸 Envoyer de l'argent à <strong>Marlet Djenontin</strong></h1>
    <p>Collecte de fonds pour son projet. Paiement via <strong>MTN Mobile Money</strong> ou <strong>Moov Money</strong>.</p>
    <div class="methods">
      <span>📱 MTN MoMo</span><span>📱 Moov Money</span>
    </div>
    <form id="form">
      <label>Montant (XOF)</label>
      <input name="amount" type="number" min="100" placeholder="Ex: 5000" required>
      <label>Prénom</label>
      <input name="firstname" placeholder="Ton prénom" required>
      <label>Nom</label>
      <input name="lastname" placeholder="Ton nom" required>
      <label>Email</label>
      <input name="email" type="email" placeholder="ton@email.com" required>
      <label>Téléphone (numéro Mobile Money)</label>
      <input name="phone" type="tel" placeholder="01XXXXXXXX" pattern="01[0-9]{8}" required>
      <label>Mode de paiement</label>
      <select name="mode">
        <option value="mtn">MTN Mobile Money</option>
        <option value="moov">Moov Money</option>
        <option value="">Autres méthodes (page FedaPay)</option>
      </select>
      <button id="btn" type="submit">Payer</button>
    </form>
    <p id="msg"></p>
  </div>
  <div id="modal" class="modal">
    <div class="modal-box">
      <p id="modalText"></p>
    </div>
  </div>
  <script>
    const modal = document.getElementById('modal');
    const modalText = document.getElementById('modalText');
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });
    function showModal(text) { modalText.textContent = text; modal.classList.add('show'); }
    const form = document.getElementById('form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Création du paiement...';
      document.getElementById('msg').textContent = '';
      const data = Object.fromEntries(new FormData(form));
      if (!/^01\d{8}$/.test(data.phone.replace(/\s/g, ''))) {
        showModal('❌ Le numéro doit commencer par 01 et contenir 10 chiffres.');
        btn.disabled = false; btn.textContent = 'Payer';
        return;
      }
      const res = await fetch('/api/create-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const json = await res.json();
      if (json.url) {
        window.location.href = json.url; // page de paiement FedaPay
      } else if (json.message) {
        showModal(json.message);
        // Surveille le statut et affiche un message clair au client
        if (json.transactionId) {
          const poll = setInterval(async () => {
            try {
              const s = await (await fetch(`/api/status?id=${json.transactionId}`)).json();
              modalText.textContent = s.message;
              if (s.status === 'approved' || s.status === 'canceled' || s.status === 'declined' || s.status === 'transferred') {
                clearInterval(poll);
                btn.disabled = false; btn.textContent = 'Payer';
              }
            } catch {}
          }, 4000);
          setTimeout(() => { clearInterval(poll); btn.disabled = false; btn.textContent = 'Payer'; }, 90000);
        }
      } else {
        showModal(json.error || 'Erreur');
        btn.disabled = false; btn.textContent = 'Payer';
      }
    });
  </script>
</body>
</html>
