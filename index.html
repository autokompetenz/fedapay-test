<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Envoyer de l'argent à Marlet Djenontin</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f5f7fa; margin: 0; padding: 20px 16px; }
    .card { background: #fff; max-width: 480px; margin: auto; padding: 24px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.3rem; }
    label { font-size: .85rem; color: #555; }
    input, select { width: 100%; padding: 14px; margin: 6px 0 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
    button { width: 100%; padding: 16px; background: #16a34a; color: #fff; border: none; border-radius: 8px; font-size: 1.05rem; cursor: pointer; }
    button:disabled { opacity: .6; }
    .methods { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .methods span { border: 1px solid #eee; padding: 8px 12px; border-radius: 8px; font-size: .85rem; }
    #msg { margin-top: 16px; color: #b91c1c; word-break: break-word; }
    @media (max-width: 480px) {
      .card { padding: 20px; border-radius: 12px; }
      h1 { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💸 Envoyer de l'argent à <strong>Marlet Djenontin</strong></h1>
    <p>Collecte de fonds pour son projet. Paiement via <strong>MTN Mobile Money</strong> ou <strong>Moov Money</strong>.</p>
    <div class="methods">
      <span>📱 MTN MoMo</span><span>📱 Moov Money</span>
    </div>
    <form id="form">
      <label>Montant (XOF)</label>
      <input name="amount" type="number" min="100" placeholder="Ex: 5000" required>
      <label>Prénom</label>
      <input name="firstname" placeholder="Ton prénom" required>
      <label>Nom</label>
      <input name="lastname" placeholder="Ton nom" required>
      <label>Email</label>
      <input name="email" type="email" placeholder="ton@email.com" required>
      <label>Téléphone (numéro Mobile Money)</label>
      <input name="phone" type="tel" placeholder="97XXXXXX" required>
      <label>Mode de paiement</label>
      <select name="mode">
        <option value="mtn">MTN Mobile Money</option>
        <option value="moov">Moov Money</option>
        <option value="">Autres méthodes (page FedaPay)</option>
      </select>
      <button id="btn" type="submit">Payer</button>
    </form>
    <p id="msg"></p>
  </div>
  <script>
    const form = document.getElementById('form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Création du paiement...';
      document.getElementById('msg').textContent = '';
      const data = Object.fromEntries(new FormData(form));
      const res = await fetch('/api/create-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const json = await res.json();
      if (json.url) {
        window.location.href = json.url; // page de paiement FedaPay
      } else if (json.message) {
        document.getElementById('msg').style.color = '#16a34a';
        document.getElementById('msg').textContent = json.message;
        btn.disabled = false; btn.textContent = 'Payer';
      } else {
        document.getElementById('msg').textContent = json.error || 'Erreur';
        btn.disabled = false; btn.textContent = 'Payer';
      }
    });
  </script>
</body>
</html>
