<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collecte de fonds pour Marlet Djenontin</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f5f7fa; margin: 0; padding: 20px 16px; }
    .card { background: #fff; max-width: 480px; margin: auto; padding: 24px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.3rem; }
    label { font-size: .85rem; color: #555; }
    input, select { width: 100%; padding: 14px; margin: 6px 0 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
    button { width: 100%; padding: 16px; background: #16a34a; color: #fff; border: none; border-radius: 8px; font-size: 1.05rem; cursor: pointer; }
    button:disabled { opacity: .6; }
    .hidden { display: none; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:10; align-items:center; justify-content:center; padding:20px; }
    .modal.show { display:flex; }
    .modal-box { background:#fff; border-radius:14px; padding:28px 24px; max-width:380px; width:100%; text-align:center; font-size:1.05rem; box-shadow:0 20px 50px rgba(0,0,0,.25); }
    .choice-btn { background:#111; margin-bottom:12px; }
    .paypal-btn { background:#003087; }
    #msg { margin-top:16px; color:#b91c1c; }
    @media (max-width: 480px) { .card { padding:20px; border-radius:12px; } h1 { font-size:1.15rem; } }
  </style>
</head>
<body>

  <!-- Modale d'introduction -->
  <div id="intro" class="modal show">
    <div class="modal-box">
      <h1>💸 Marlet Djenontin</h1>
      <p>Ceci est un site de paiement pour soutenir <strong>Marlet Djenontin</strong> dans une collecte de fonds pour son projet.</p>
      <button id="startBtn" type="button">Contribuer</button>
    </div>
  </div>

  <!-- Modale choix du mode de paiement -->
  <div id="choice" class="modal">
    <div class="modal-box">
      <h1>Comment veux-tu payer ?</h1>
      <button class="choice-btn" id="chooseMM" type="button">📱 Mobile Money (MTN / Moov)</button>
      <button class="choice-btn" id="chooseCard" type="button">💛 PayPal</button>
    </div>
  </div>

  <!-- Modale statut -->
  <div id="modal" class="modal">
    <div class="modal-box"><p id="modalText"></p></div>
  </div>

  <!-- Page paiement Mobile Money -->
  <div id="pageMM" class="card hidden">
    <h1>📱 Paiement Mobile Money</h1>
    <form id="formMM">
      <label>Montant (XOF)</label>
      <input name="amount" type="number" min="100" placeholder="Ex: 5000" required>
      <label>Prénom</label>
      <input name="firstname" placeholder="Ton prénom" required>
      <label>Nom</label>
      <input name="lastname" placeholder="Ton nom" required>
      <label>Email</label>
      <input name="email" type="email" placeholder="ton@email.com" required>
      <label>Téléphone (numéro Mobile Money)</label>
      <input name="phone" type="tel" placeholder="01XXXXXXXX" pattern="01[0-9]{8}" required>
      <label>Opérateur</label>
      <select name="mode">
        <option value="mtn">MTN Mobile Money</option>
        <option value="moov">Moov Money</option>
      </select>
      <button type="submit" id="btnMM">Payer</button>
    </form>
  </div>

  <!-- Page paiement Carte / PayPal -->
  <div id="pageCard" class="card hidden">
    <h1>💳 Paiement via PayPal</h1>
    <p>Clique sur le bouton PayPal pour finaliser ton don.</p>
    <div id="paypal-container-3RV4LYG8ELUB4"></div>
  </div>

  <script src="https://www.paypal.com/sdk/js?client-id=BAA9Yv_P7qCTFB3W2igMS5gzstYeREuywMqJbjqxOwb4HkUCFSJ-74-ptINbeRsiZTYnoiQtWUQnw9zeCc&components=hosted-buttons&disable-funding=venmo&currency=USD" crossorigin="anonymous" async></script>
  <script>
    const modal = document.getElementById('modal');
    const modalText = document.getElementById('modalText');
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });
    function showModal(text) { modalText.textContent = text; modal.classList.add('show'); }

    document.getElementById('startBtn').onclick = () => {
      document.getElementById('intro').classList.remove('show');
      document.getElementById('choice').classList.add('show');
    };
    document.getElementById('chooseMM').onclick = () => {
      document.getElementById('choice').classList.remove('show');
      document.getElementById('pageMM').classList.remove('hidden');
    };
    document.getElementById('chooseCard').onclick = () => {
      document.getElementById('choice').classList.remove('show');
      document.getElementById('pageCard').classList.remove('hidden');
    };

    // PayPal hosted button
    window.addEventListener('load', () => {
      const render = () => paypal.HostedButtons({ hostedButtonId: "3RV4LYG8ELUB4" }).render("#paypal-container-3RV4LYG8ELUB4");
      if (window.paypal) render(); else setTimeout(render, 1500);
    });

    // Mobile Money
    document.getElementById('formMM').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnMM');
      btn.disabled = true; btn.textContent = 'Création du paiement...';
      const data = Object.fromEntries(new FormData(e.target));
      if (!/^01\d{8}$/.test(data.phone.replace(/\s/g, ''))) {
        showModal('❌ Le numéro doit commencer par 01 et contenir 10 chiffres.');
        btn.disabled = false; btn.textContent = 'Payer';
        return;
      }
      const res = await fetch('/api/create-payment', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
      });
      const json = await res.json();
      if (json.message) {
        showModal(json.message);
        if (json.transactionId) {
          const poll = setInterval(async () => {
            try {
              const s = await (await fetch(`/api/status?id=${json.transactionId}`)).json();
              modalText.textContent = s.message;
              if (['approved','canceled','declined','transferred'].includes(s.status)) {
                clearInterval(poll); btn.disabled = false; btn.textContent = 'Payer';
              }
            } catch {}
          }, 4000);
          setTimeout(() => { clearInterval(poll); btn.disabled = false; btn.textContent = 'Payer'; }, 90000);
        }
      } else {
        showModal(json.error || 'Erreur');
        btn.disabled = false; btn.textContent = 'Payer';
      }
    });

  </script>
</body>
</html>
